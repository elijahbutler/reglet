version: "2.1"

executors:
  bun-executor:
    docker:
      - image: cimg/base:current
    resource_class: medium
    environment:
      BUN_VERSION: "1.4.0"

jobs:
  test:
    executor: bun-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-bun-deps-{{ checksum "bun.lock" }}
            - v1-bun-deps-
      - run:
          name: Install Bun
          command: |
            curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
            echo 'export BUN_INSTALL="$HOME/.bun"' >> "$BASH_ENV"
            echo 'export PATH="$BUN_INSTALL/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - save_cache:
          key: v1-bun-deps-{{ checksum "bun.lock" }}
          paths:
            - ~/.bun/install/cache
            - node_modules
      - run:
          name: Typecheck
          command: bun run typecheck
      - run:
          name: Lint
          command: bun run lint
      - run:
          name: Monorepo tests
          command: bun run test
      - run:
          name: Desktop tests
          command: bun run desktop:test

workflows:
  build-and-test:
    jobs:
      - test
