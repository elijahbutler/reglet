name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.13

jobs:
  build-tauri-windows:
    name: Build unsigned Tauri Windows artifacts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - run: bun install --frozen-lockfile
      - run: bun audit --production
      - run: bun run typecheck
      - run: bun run desktop:test
      - run: bun test packages/core/test/sync-v2-credentials.test.ts
      - run: bun run build:binaries -- windows-x64
      - run: bash scripts/stage-tauri-sidecars.sh x86_64-pc-windows-msvc
      - run: bash scripts/build-tauri-desktop.sh x86_64-pc-windows-msvc nsis
        env:
          REGLET_CREATE_UPDATER_ARTIFACTS: "1"
          REGLET_UPDATER_PUBLIC_KEY: ${{ vars.REGLET_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Collect Windows desktop artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/desktop
          installer="$(find apps/desktop/src-tauri/target -path '*/bundle/nsis/*' -type f -name '*.exe' | head -n 1)"
          test -n "$installer"
          test -f "$installer.sig"
          cp "$installer" dist/desktop/reglet-desktop-windows-x64-setup.exe
          cp "$installer.sig" dist/desktop/reglet-desktop-windows-x64-setup.exe.sig
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-windows-unsigned
          path: |
            dist/reglet-windows-x64.exe
            dist/desktop/*

  build-tauri-macos-intel:
    name: Build Intel Tauri macOS artifacts
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - run: bun install --frozen-lockfile
      - run: bun audit --production
      - run: bun test packages/core/test/sync-v2-credentials.test.ts
      - run: REGLET_ARCH=x86_64 bun run build:macos-release
        env:
          REGLET_CREATE_UPDATER_ARTIFACTS: "1"
          REGLET_UPDATER_PUBLIC_KEY: ${{ vars.REGLET_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-macos-intel
          path: |
            dist/reglet-darwin-x64
            dist/desktop/reglet-desktop-macos-x86_64.app.zip
            dist/desktop/reglet-desktop-macos-x86_64.dmg
            dist/desktop/reglet-desktop-macos-x86_64.app.tar.gz
            dist/desktop/reglet-desktop-macos-x86_64.app.tar.gz.sig

  build-tauri-linux:
    name: Build Tauri Linux artifacts
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      - run: bun audit --production
      - run: bun run typecheck
      - run: bun run desktop:test
      - run: bun run build:binaries -- linux-x64 linux-arm64
      - run: bash scripts/stage-tauri-sidecars.sh x86_64-unknown-linux-gnu
      - run: bash scripts/build-tauri-desktop.sh x86_64-unknown-linux-gnu deb,appimage
        env:
          NO_STRIP: "true"
          REGLET_CREATE_UPDATER_ARTIFACTS: "1"
          REGLET_TAURI_VERBOSE: "1"
          REGLET_UPDATER_PUBLIC_KEY: ${{ vars.REGLET_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Collect Linux desktop artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/desktop
          deb="$(find apps/desktop/src-tauri/target -path '*/bundle/deb/*' -type f -name '*.deb' | head -n 1)"
          appimage="$(find apps/desktop/src-tauri/target -path '*/bundle/appimage/*' -type f -name '*.AppImage' | head -n 1)"
          test -n "$deb"
          test -n "$appimage"
          test -f "$appimage.sig"
          cp "$deb" dist/desktop/reglet-desktop-linux-x86_64.deb
          cp "$appimage" dist/desktop/reglet-desktop-linux-x86_64.AppImage
          cp "$appimage.sig" dist/desktop/reglet-desktop-linux-x86_64.AppImage.sig
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-linux
          path: |
            dist/reglet-linux-x64
            dist/reglet-linux-arm64
            dist/desktop/*

  publish-release:
    needs: [build-tauri-windows, build-tauri-macos-intel, build-tauri-linux]
    runs-on: macos-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: bun install --frozen-lockfile
      - run: bun audit --production
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run desktop:typecheck
      - run: bun run desktop:lint
      - run: bun run desktop:test
      - run: bun test scripts/generate-tauri-updater-config.test.ts scripts/generate-tauri-updater-manifest.test.ts
      - run: bun run test:homebrew-publisher
      - run: bash scripts/stage-tauri-check-sidecar.sh
      - run: bun run desktop:cargo:check
      - run: bun run desktop:cargo:test
      - name: Build ad-hoc-signed unnotarized Apple silicon Tauri artifacts
        run: REGLET_ARCH=arm64 bun run build:macos-release
        env:
          REGLET_CREATE_UPDATER_ARTIFACTS: "1"
          REGLET_UPDATER_PUBLIC_KEY: ${{ vars.REGLET_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/download-artifact@v4
        with:
          name: tauri-windows-unsigned
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: tauri-macos-intel
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: tauri-linux
          path: dist
      - run: bun run build:updater-manifest
      - name: Create checksums and release provenance
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist
            shasum -a 256 \
              reglet-darwin-arm64 \
              reglet-darwin-x64 \
              reglet-windows-x64.exe \
              reglet-linux-arm64 \
              reglet-linux-x64 \
              desktop/* > SHA256SUMS.txt
          )
          {
            printf 'commit=%s\nref=%s\nrun=%s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID"
            printf 'artifacts=%s\n' "standalone CLI binaries, platform installers, and cryptographically signed Tauri updater artifacts plus latest.json"
          } > dist/provenance.txt
      - run: bun run build:homebrew-formula
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/reglet-darwin-arm64
            dist/reglet-darwin-x64
            dist/reglet-windows-x64.exe
            dist/reglet-linux-arm64
            dist/reglet-linux-x64
            dist/desktop/*
            dist/SHA256SUMS.txt
      - name: Create or reuse draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; uploading artifacts with --clobber."
          else
            echo "Creating draft release $GITHUB_REF_NAME."
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --notes "Includes standalone CLI binaries for macOS, Windows, and Linux; desktop artifacts for all three platforms; and cryptographically signed in-app updater artifacts. macOS artifacts are not Developer ID signed and Windows may require SmartScreen approval."
          fi
          gh release upload "$GITHUB_REF_NAME" --clobber \
            dist/reglet-darwin-arm64 \
            dist/reglet-darwin-x64 \
            dist/reglet-windows-x64.exe \
            dist/reglet-linux-arm64 \
            dist/reglet-linux-x64 \
            dist/desktop/* \
            dist/SHA256SUMS.txt \
            dist/provenance.txt
      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: bash scripts/publish-homebrew-tap.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "$GITHUB_REF_NAME" --draft=false
