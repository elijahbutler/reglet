name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  BUN_VERSION: 1.3.13

jobs:
  bun:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun audit --production
        if: runner.os == 'Linux'
      - run: bun run typecheck
      - run: bun run lint
        if: runner.os == 'Linux'
      - run: bun run test

  desktop:
    name: Desktop frontend
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run desktop:typecheck
      - run: bun run desktop:lint
        if: runner.os == 'Linux'
      - run: bun run desktop:test

  server-admin:
    name: Server dashboard and image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run server-admin:typecheck
      - run: bun run server-admin:lint
      - run: bun run --cwd apps/server-admin build
      - run: docker build -f Dockerfile.sync .

  desktop-rust:
    name: Desktop Rust bridge
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Stage cargo-check sidecar
        shell: bash
        run: bash scripts/stage-tauri-check-sidecar.sh
      - run: cd apps/desktop/src-tauri && cargo check
      - run: cd apps/desktop/src-tauri && cargo test
