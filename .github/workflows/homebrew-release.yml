name: Homebrew Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to publish to Homebrew
        required: true
        type: string

concurrency:
  group: homebrew-reglet
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-homebrew:
    name: Publish formula and cask
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Resolve release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid Reglet release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          printf 'REGLET_VERSION=%s\n' "${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          printf 'REGLET_RELEASE_TAG=%s\n' "$RELEASE_TAG" >> "$GITHUB_ENV"
      - name: Download Homebrew release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/desktop
          gh release download "$REGLET_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir dist \
            --pattern reglet-darwin-arm64 \
            --pattern reglet-darwin-x64
          gh release download "$REGLET_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir dist/desktop \
            --pattern reglet-desktop-macos-arm64.dmg \
            --pattern reglet-desktop-macos-x86_64.dmg
      - run: bash scripts/generate-homebrew-formula.sh
      - name: Publish Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: bash scripts/publish-homebrew-tap.sh
