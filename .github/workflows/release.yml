name: Release

on:
  push:
    tags:
      - "v*"

env:
  BUN_VERSION: 1.4.0

jobs:
  publish-cli-release:
    name: Build and publish CLI binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile
      - run: bun audit --production
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test

      - name: Build cross-platform CLI binaries
        run: bun run build:binaries

      - name: Create checksums and release provenance
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist
            shasum -a 256 \
              reglet-darwin-arm64 \
              reglet-darwin-x64 \
              reglet-windows-x64.exe \
              reglet-linux-arm64 \
              reglet-linux-x64 > SHA256SUMS.txt
          )
          {
            printf 'commit=%s\nref=%s\nrun=%s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID"
            printf 'artifacts=%s\n' "standalone CLI binaries for macOS, Linux, and Windows"
          } > dist/provenance.txt

      - name: Build Homebrew formula
        run: bun run build:homebrew-formula

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/reglet-darwin-arm64
            dist/reglet-darwin-x64
            dist/reglet-windows-x64.exe
            dist/reglet-linux-arm64
            dist/reglet-linux-x64
            dist/SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            dist/reglet-darwin-arm64 \
            dist/reglet-darwin-x64 \
            dist/reglet-windows-x64.exe \
            dist/reglet-linux-arm64 \
            dist/reglet-linux-x64 \
            dist/SHA256SUMS.txt \
            dist/provenance.txt \
            --title "$GITHUB_REF_NAME" \
            --notes "Includes standalone CLI binaries for macOS (arm64 & x64), Windows (x64), and Linux (x64 & arm64)."

      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: bash scripts/publish-homebrew-tap.sh
