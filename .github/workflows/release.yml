name: Release

on:
  push:
    tags:
      - "v*"

env:
  BUN_VERSION: 1.3.13

jobs:
  build-tauri-windows:
    name: Build unsigned Tauri Windows artifacts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - run: bun install --frozen-lockfile
      - run: bun audit --production
      - run: bun run typecheck
      - run: bun run desktop:test
      - run: bun test packages/core/test/sync-v2-credentials.test.ts
      - run: bun run build:binaries -- windows-x64
      - run: bash scripts/stage-tauri-sidecars.sh x86_64-pc-windows-msvc
      - run: bash scripts/build-tauri-desktop.sh x86_64-pc-windows-msvc nsis
      - name: Collect Windows desktop artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/desktop
          installer="$(find apps/desktop/src-tauri/target -path '*/bundle/nsis/*' -type f -name '*.exe' | head -n 1)"
          test -n "$installer"
          cp "$installer" dist/desktop/reglet-desktop-windows-x64-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-windows-unsigned
          path: |
            dist/reglet-windows-x64.exe
            dist/desktop/*

  build-tauri-macos-intel:
    name: Build Intel Tauri macOS artifacts
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - run: bun install --frozen-lockfile
      - run: bun audit --production
      - run: bun test packages/core/test/sync-v2-credentials.test.ts
      - run: REGLET_ARCH=x86_64 bun run build:macos-release
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-macos-intel
          path: |
            dist/reglet-darwin-x64
            dist/desktop/reglet-desktop-macos-x86_64.app.zip
            dist/desktop/reglet-desktop-macos-x86_64.dmg

  publish-release:
    needs: [build-tauri-windows, build-tauri-macos-intel]
    runs-on: macos-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: bun install --frozen-lockfile
      - run: bun audit --production
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run desktop:typecheck
      - run: bun run desktop:lint
      - run: bun run desktop:test
      - run: bash scripts/stage-tauri-check-sidecar.sh
      - run: bun run desktop:cargo:check
      - run: bun run desktop:cargo:test
      - name: Build ad-hoc-signed unnotarized Apple silicon Tauri artifacts
        run: REGLET_ARCH=arm64 bun run build:macos-release
      - uses: actions/download-artifact@v4
        with:
          name: tauri-windows-unsigned
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: tauri-macos-intel
          path: dist
      - name: Create checksums and release provenance
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist
            shasum -a 256 \
              reglet-darwin-arm64 \
              reglet-darwin-x64 \
              reglet-windows-x64.exe \
              desktop/* > SHA256SUMS.txt
          )
          {
            printf 'commit=%s\nref=%s\nrun=%s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID"
            printf 'artifacts=%s\n' "standalone CLI binaries, ad-hoc-signed unnotarized Tauri macOS artifacts, unsigned Tauri Windows artifacts"
          } > dist/provenance.txt
      - run: bun run build:homebrew-formula
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/reglet-darwin-arm64
            dist/reglet-darwin-x64
            dist/reglet-windows-x64.exe
            dist/desktop/*
            dist/SHA256SUMS.txt
      - name: Create or reuse draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if release_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$release_draft" != "true" ]]; then
              echo "::error::Release $GITHUB_REF_NAME is already public; refusing to bypass the required Homebrew tap gate." >&2
              exit 1
            fi
            echo "Reusing existing draft release $GITHUB_REF_NAME."
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --notes "Includes standalone CLI binaries, ad-hoc-signed unnotarized macOS desktop artifacts, and unsigned Windows desktop artifacts. macOS artifacts are not Developer ID signed and Windows may require SmartScreen approval. Linux GUI packaging is structurally prepared but not published."
          fi
          gh release upload "$GITHUB_REF_NAME" --clobber \
            dist/reglet-darwin-arm64 \
            dist/reglet-darwin-x64 \
            dist/reglet-windows-x64.exe \
            dist/desktop/* \
            dist/SHA256SUMS.txt \
            dist/provenance.txt
      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${HOMEBREW_TAP_TOKEN:-}" ]]; then
            echo "HOMEBREW_TAP_TOKEN is required to publish Reglet releases. It must push Formula/reglet.rb and Casks/reglet.rb to elijahbutler/homebrew-reglet." >&2
            exit 1
          fi

          TAP_DIR="$RUNNER_TEMP/homebrew-reglet"
          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/elijahbutler/homebrew-reglet.git" "$TAP_DIR"
          mkdir -p "$TAP_DIR/Formula" "$TAP_DIR/Casks"
          cp dist/homebrew/Formula/reglet.rb "$TAP_DIR/Formula/reglet.rb"
          cp dist/homebrew/Casks/reglet.rb "$TAP_DIR/Casks/reglet.rb"

          git -C "$TAP_DIR" config user.name "github-actions[bot]"
          git -C "$TAP_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$TAP_DIR" add Formula/reglet.rb Casks/reglet.rb
          if git -C "$TAP_DIR" diff --cached --quiet; then
            echo "Homebrew tap already up to date."
            exit 0
          fi
          git -C "$TAP_DIR" commit -m "reglet ${GITHUB_REF_NAME}"
          git -C "$TAP_DIR" push origin HEAD:main
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "$GITHUB_REF_NAME" --draft=false
