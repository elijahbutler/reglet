[package]
name = "reglet-desktop"
version = "0.1.0"
description = "Reglet desktop manager"
edition = "2021"

[lib]
name = "reglet_desktop"
path = "src/lib.rs"

[[bin]]
name = "reglet-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
