    <text x="148" y="42" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">adapters</text>
    <text x="260" y="42" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">agents</text>
    <circle cx="60" cy="126" r="22" fill="#111827"/>
    <rect x="124" y="72" width="82" height="34" rx="8" fill="#2563eb"/>
    <rect x="124" y="114" width="82" height="34" rx="8" fill="#0891b2"/>
    <rect x="124" y="156" width="82" height="34" rx="8" fill="#16a34a"/>
    <circle cx="288" cy="82" r="18" fill="#7c3aed"/>
    <circle cx="288" cy="126" r="18" fill="#f59e0b"/>
