<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Reglet engineering control plane</title>
  <desc id="desc">A terminal-style systems diagram showing Reglet compiling one master directory into local AI agent provider outputs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .panel { fill: #0f172a; stroke: #334155; stroke-width: 1.5; }
      .muted { fill: #94a3b8; }
      .text { fill: #e5e7eb; }
      .green { fill: #34d399; }
      .blue { fill: #60a5fa; }
      .amber { fill: #fbbf24; }
      .line { stroke: #64748b; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect x="32" y="28" width="1216" height="364" rx="14" class="panel"/>

  <g class="sans">
    <text x="70" y="82" class="muted" font-size="18" font-weight="700">REGLET</text>
    <text x="70" y="126" class="text" font-size="38" font-weight="800">Agent config as local infrastructure</text>
    <text x="70" y="158" class="muted" font-size="18">One auditable master directory compiled into every local AI coding tool.</text>
  </g>

  <g transform="translate(70 196)">
    <rect width="505" height="148" rx="10" fill="#020617" stroke="#1e293b"/>
    <circle cx="24" cy="24" r="5" fill="#ef4444"/>
    <circle cx="42" cy="24" r="5" fill="#f59e0b"/>
    <circle cx="60" cy="24" r="5" fill="#22c55e"/>
    <text x="24" y="60" class="mono green" font-size="15">$ reglet plan --provider claude,codex --content rules,mcp --json</text>
    <text x="24" y="90" class="mono text" font-size="15">reads:  ~/.claude/CLAUDE.md, ~/.codex/config.toml</text>
    <text x="24" y="116" class="mono text" font-size="15">writes: ~/.reglet/rules/*, provider outputs</text>
    <text x="24" y="142" class="mono amber" font-size="15">daemon=off sync=off notifications=off</text>
  </g>

  <g transform="translate(644 82)" class="mono">
    <rect width="250" height="236" rx="10" class="panel"/>
    <text x="24" y="36" class="blue" font-size="15" font-weight="700">~/.reglet/</text>
    <text x="24" y="72" class="text" font-size="15">rules/*.md</text>
    <text x="24" y="102" class="text" font-size="15">skills/*/SKILL.md</text>
    <text x="24" y="132" class="text" font-size="15">mcp/servers.json</text>
    <text x="24" y="162" class="text" font-size="15">reglet.toml</text>
    <text x="24" y="202" class="muted" font-size="13">manifest + backups</text>
  </g>

  <path d="M894 198 H956" class="line"/>
  <path d="M948 190 L960 198 L948 206" fill="none" stroke="#64748b" stroke-width="2"/>

  <g transform="translate(966 70)" class="mono">
    <rect width="220" height="260" rx="10" class="panel"/>
    <text x="22" y="38" class="blue" font-size="15" font-weight="700">provider outputs</text>
    <text x="22" y="76" class="text" font-size="14">claude  CLAUDE.md</text>
    <text x="22" y="106" class="text" font-size="14">codex   AGENTS.md</text>
    <text x="22" y="136" class="text" font-size="14">cursor  mcp.json</text>
    <text x="22" y="166" class="text" font-size="14">gemini  settings.json</text>
    <text x="22" y="196" class="text" font-size="14">windsurf mcp_config</text>
    <text x="22" y="226" class="text" font-size="14">opencode opencode.json</text>
  </g>

  <g class="sans">
    <rect x="644" y="344" width="542" height="30" rx="6" fill="#172554" stroke="#1d4ed8"/>
    <text x="664" y="365" fill="#bfdbfe" font-size="14" font-weight="700">deterministic apply  |  drift detection  |  restore/revert  |  optional sync</text>
  </g>
</svg>
