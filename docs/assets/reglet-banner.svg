    <path d="M82 126 L124 89 M82 126 L124 131 M82 126 L124 173 M206 89 L270 82 M206 131 L270 126 M206 173 L270 170" fill="none" stroke="#374151" stroke-width="5" stroke-linecap="round"/>
    <rect x="44" y="212" width="268" height="12" rx="6" fill="#e5e7eb"/>
