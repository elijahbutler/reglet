<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Reglet lifecycle</title>
  <desc id="desc">A five-step lifecycle: onboard, manage the master directory, apply adapters, detect drift, and sync devices.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="960" height="360" fill="#ffffff"/>
  <text x="42" y="54" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="800">Unified local agent config lifecycle</text>
  <text x="42" y="84" fill="#4b5563" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Reglet keeps global prompts, skills, and MCP servers explicit, backed up, and portable.</text>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(34 132)">
      <rect width="136" height="112" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
      <circle cx="28" cy="30" r="13" fill="#2563eb"/>
      <text x="23" y="35" fill="#ffffff" font-size="14" font-weight="800">1</text>
      <text x="20" y="64" fill="#111827" font-size="17" font-weight="800">Onboard</text>
      <text x="20" y="88" fill="#374151" font-size="13">Scan and import</text>
      <text x="20" y="106" fill="#374151" font-size="13">existing tools</text>
    </g>
    <path d="M182 188 H222" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arrow)"/>
    <g transform="translate(234 132)">
      <rect width="136" height="112" rx="10" fill="#ecfeff" stroke="#a5f3fc"/>
      <circle cx="28" cy="30" r="13" fill="#0891b2"/>
      <text x="23" y="35" fill="#ffffff" font-size="14" font-weight="800">2</text>
      <text x="20" y="64" fill="#111827" font-size="17" font-weight="800">Master</text>
      <text x="20" y="88" fill="#374151" font-size="13">Rules, skills,</text>
      <text x="20" y="106" fill="#374151" font-size="13">MCP servers</text>
    </g>
    <path d="M382 188 H422" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arrow)"/>
    <g transform="translate(434 132)">
      <rect width="136" height="112" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
      <circle cx="28" cy="30" r="13" fill="#16a34a"/>
      <text x="23" y="35" fill="#ffffff" font-size="14" font-weight="800">3</text>
      <text x="20" y="64" fill="#111827" font-size="17" font-weight="800">Apply</text>
      <text x="20" y="88" fill="#374151" font-size="13">Convert into</text>
      <text x="20" y="106" fill="#374151" font-size="13">provider files</text>
    </g>
    <path d="M582 188 H622" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arrow)"/>
    <g transform="translate(634 132)">
      <rect width="136" height="112" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
      <circle cx="28" cy="30" r="13" fill="#f97316"/>
      <text x="23" y="35" fill="#ffffff" font-size="14" font-weight="800">4</text>
      <text x="20" y="64" fill="#111827" font-size="17" font-weight="800">Drift</text>
      <text x="20" y="88" fill="#374151" font-size="13">Import edits or</text>
      <text x="20" y="106" fill="#374151" font-size="13">unenroll files</text>
    </g>
    <path d="M782 188 H822" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arrow)"/>
    <g transform="translate(834 132)">
      <rect width="92" height="112" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
      <circle cx="28" cy="30" r="13" fill="#7c3aed"/>
      <text x="23" y="35" fill="#ffffff" font-size="14" font-weight="800">5</text>
      <text x="18" y="64" fill="#111827" font-size="17" font-weight="800">Sync</text>
      <text x="18" y="88" fill="#374151" font-size="13">Devices</text>
      <text x="18" y="106" fill="#374151" font-size="13">and server</text>
    </g>
  </g>

  <path d="M875 260 C740 324 246 324 94 260" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="7 7"/>
  <g transform="translate(386 276)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect width="190" height="54" rx="10" fill="#111827"/>
    <text x="24" y="34" fill="#ffffff" font-size="16" font-weight="800">Backups and history</text>
  </g>
</svg>
