<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="440" viewBox="0 0 1040 440" role="img" aria-labelledby="title desc">
  <title id="title">Reglet lifecycle system diagram</title>
  <desc id="desc">System diagram showing scan and import feeding the Reglet master directory, provider adapters writing outputs, and drift, backups, and receipt-backed recovery loops.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569"/>
    </marker>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; }
      .dark { fill: #0f172a; stroke: #334155; stroke-width: 1.4; }
      .state { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; }
      .text { fill: #0f172a; }
      .muted { fill: #475569; }
      .light { fill: #e5e7eb; }
      .blue { fill: #2563eb; }
      .green { fill: #059669; }
      .amber { fill: #b45309; }
      .line { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #94a3b8; stroke-width: 2; fill: none; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1040" height="440" fill="#f8fafc"/>
  <text x="38" y="48" class="sans text" font-size="28" font-weight="800">Reglet local config pipeline</text>
  <text x="38" y="76" class="sans muted" font-size="15">Explicit reads, deterministic writes, manifest-backed recovery, local-only V1.</text>

  <g transform="translate(38 112)">
    <rect width="190" height="118" rx="8" class="box"/>
    <text x="18" y="34" class="mono blue" font-size="14" font-weight="700">provider inventory</text>
    <text x="18" y="66" class="mono text" font-size="13">~/.claude</text>
    <text x="18" y="88" class="mono text" font-size="13">~/.codex</text>
    <text x="18" y="110" class="mono text" font-size="13">~/.cursor, ...</text>
  </g>

  <path d="M236 170 H298" class="line"/>
  <text x="250" y="154" class="mono muted" font-size="12">scan/import</text>

  <g transform="translate(308 96)">
    <rect width="230" height="150" rx="8" class="dark"/>
    <text x="20" y="34" class="mono light" font-size="14" font-weight="700">~/.reglet/</text>
    <text x="20" y="66" class="mono light" font-size="13">rules/*.md</text>
    <text x="20" y="90" class="mono light" font-size="13">skills/*/</text>
    <text x="20" y="114" class="mono light" font-size="13">mcp/servers.json</text>
    <text x="20" y="138" class="mono light" font-size="13">reglet.toml</text>
  </g>

  <path d="M548 170 H610" class="line"/>
  <text x="562" y="154" class="mono muted" font-size="12">apply</text>

  <g transform="translate(620 96)">
    <rect width="160" height="150" rx="8" class="box"/>
    <text x="18" y="34" class="mono green" font-size="14" font-weight="700">adapters</text>
    <text x="18" y="66" class="mono text" font-size="13">rules render</text>
    <text x="18" y="90" class="mono text" font-size="13">skills copy</text>
    <text x="18" y="114" class="mono text" font-size="13">MCP merge</text>
    <text x="18" y="138" class="mono muted" font-size="12">managed keys only</text>
  </g>

  <path d="M790 170 H852" class="line"/>

  <g transform="translate(862 92)">
    <rect width="140" height="160" rx="8" class="box"/>
    <text x="18" y="34" class="mono blue" font-size="14" font-weight="700">outputs</text>
    <text x="18" y="66" class="mono text" font-size="13">CLAUDE.md</text>
    <text x="18" y="88" class="mono text" font-size="13">AGENTS.md</text>
    <text x="18" y="110" class="mono text" font-size="13">mcp.json</text>
    <text x="18" y="132" class="mono text" font-size="13">settings.json</text>
    <text x="18" y="154" class="mono text" font-size="13">opencode.json</text>
  </g>

  <g transform="translate(308 298)">
    <rect width="214" height="78" rx="8" class="state"/>
    <text x="18" y="30" class="mono amber" font-size="13" font-weight="700">.state/manifest.json</text>
    <text x="18" y="56" class="mono muted" font-size="12">hash, backup, managed keys</text>
  </g>

  <g transform="translate(548 298)">
    <rect width="168" height="78" rx="8" class="state"/>
    <text x="18" y="30" class="mono amber" font-size="13" font-weight="700">backups/</text>
    <text x="18" y="56" class="mono muted" font-size="12">restore / revert</text>
  </g>

  <g transform="translate(742 298)">
    <rect width="128" height="78" rx="8" class="state"/>
    <text x="18" y="30" class="mono amber" font-size="13" font-weight="700">drift.json</text>
    <text x="18" y="56" class="mono muted" font-size="12">import edits</text>
  </g>

  <g transform="translate(38 298)">
    <rect width="190" height="78" rx="8" class="state"/>
    <text x="18" y="30" class="mono amber" font-size="13" font-weight="700">preview digest</text>
    <text x="18" y="56" class="mono muted" font-size="12">local apply contract</text>
  </g>

  <path d="M416 252 V288" class="dash"/>
  <path d="M632 288 V252" class="dash"/>
  <path d="M806 288 C840 270 878 260 930 258" class="dash"/>
  <path d="M132 288 C178 250 236 244 300 246" class="dash"/>

  <g class="sans">
    <rect x="38" y="402" width="964" height="1" fill="#cbd5e1"/>
    <text x="38" y="426" class="muted" font-size="13">Daemon and notifications are runtime opt-ins. Installer and onboarding do not start background services.</text>
  </g>
</svg>
