services:
  reglet-sync:
    image: ghcr.io/elijahbutler/reglet-sync:${REGLET_SYNC_VERSION:-0.1.0}
    restart: unless-stopped
    ports:
      - "${REGLET_SYNC_PORT:-3000}:3000"
    environment:
      REGLET_TOKEN: ${REGLET_TOKEN:?Set REGLET_TOKEN to a random secret of at least 20 characters}
      REGLET_DB: /data/reglet.sqlite
    volumes:
      - reglet-sync-data:/data
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:3000/healthz');if(!r.ok)process.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true

volumes:
  reglet-sync-data:
